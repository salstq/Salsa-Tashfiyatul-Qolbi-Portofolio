<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salsa Tashfiyatul Qolbi - Data Analyst Portfolio</title>
    
    <!-- Tailwind CSS untuk UI Modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel Compiler -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const projectsData = [
          {
            id: 1,
            title: "D2C Brand Marketing Campaign Analysis",
            category: "Business Intelligence",
            tools: ["SQL", "Power BI", "GitHub"],
            summary: "Marketing campaign analytics project to evaluate performance, ROAS, channel effectiveness, and revenue trends.",
            description: "This marketing campaign analytics project utilizes SQL and Power BI to evaluate end-to-end campaign performance. By analyzing performance metrics, we calculated Return on Ad Spend (ROAS), determined channel effectiveness across multiple marketing streams, and visualized overall revenue trends.",
            githubLink: "https://github.com/salstq/Analisis-Campaign-Marketing-D2C-Brand",
            dashboardLink: "https://app.powerbi.com/groups/me/reports/e3dc7fed-c05a-474c-b763-bf23f3d116b1/c4b0aeacb588bce21c54?experience=power-bi",
            difficulty: "Intermediate",
            image: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&q=80&w=600"
          },
          {
            id: 2,
            title: "Scientific Writing: Infant Cry Classification",
            category: "Deep Learning & NLP",
            tools: ["TensorFlow", "Python", "Streamlit", "Google Colab"],
            summary: "A machine learning and audio signal processing project focused on classifying infant cries based on acoustic features.",
            description: "This scientific study aims to classify infant cries into distinct behavioral categories based on sound analysis. MFCCs (Mel-Frequency Cepstral Coefficients) were extracted from raw audio files to represent speech features.",
            githubLink: "https://github.com/salstq/Penulisan-Ilmiah-Infant-Cry",
            dashboardLink: "https://penulisan-ilmiah-infant-cry-bxuwumgwsbhverruhz7aqe.streamlit.app/",
            difficulty: "Advanced",
            image: "https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&q=80&w=600"
          },
          {
            id: 3,
            title: "Makeup & Skincare Product Recommendation System",
            category: "Predictive Analytics",
            tools: ["Google Colab", "Python", "Scikit-Learn"],
            summary: "A content-based filtering system using TF-IDF and Cosine Similarity to suggest makeup and skincare items.",
            description: "This project builds an automated recommendation engine for makeup and skincare products. By utilizing a content-based filtering approach, the system extracts critical features like product descriptions and key ingredients.",
            githubLink: "https://github.com/salstq/Recommendation-System-Products-and-Skincare-",
            difficulty: "Advanced",
            image: "https://images.unsplash.com/photo-1608248597481-496100c8c836?auto=format&fit=crop&q=80&w=600"
          }
        ];

        function App() {
          const [filterCategory, setFilterCategory] = useState("All");
          const [searchTerm, setSearchTerm] = useState("");

          useEffect(() => {
            if (window.lucide) window.lucide.createIcons();
          }, [filterCategory, searchTerm]);

          const categories = ["All", ...new Set(projectsData.map(p => p.category))];
          const filteredProjects = projectsData.filter(project => {
            return (filterCategory === "All" || project.category === filterCategory) &&
                   (project.title.toLowerCase().includes(searchTerm.toLowerCase()) || 
                    project.tools.some(t => t.toLowerCase().includes(searchTerm.toLowerCase())));
          });

          return (
            <div className="min-h-screen bg-slate-950 text-slate-100">
              <header className="sticky top-0 z-40 bg-slate-950/80 backdrop-blur-md border-b border-slate-900 h-16 flex items-center justify-between px-6">
                <div className="flex items-center space-x-2">
                  <span className="p-2 bg-gradient-to-tr from-pink-500 to-rose-500 rounded-lg font-bold">
                    <i data-lucide="database" className="w-5 h-5 text-slate-950"></i>
                  </span>
                  <span className="font-bold tracking-wider bg-gradient-to-r from-pink-400 to-fuchsia-400 bg-clip-text text-transparent">
                    SALSA TASHFIYATUL PORTFOLIO
                  </span>
                </div>
              </header>

              <section className="max-w-6xl mx-auto px-6 py-12 text-center md:text-left md:flex md:items-center md:justify-between gap-12">
                <div className="space-y-4 md:w-2/3">
                  <div className="inline-block bg-pink-500/10 text-pink-400 text-xs px-3 py-1 rounded-full font-bold">AVAILABLE FOR OPPORTUNITIES</div>
                  <h1 className="text-4xl md:text-6xl font-black text-slate-50">Salsa Tashfiyatul Qolbi</h1>
                  <p className="text-slate-400 text-lg">Data Analyst & Computer Science Enthusiast specializing in turning complex datasets into strategic insights.</p>
                </div>
                <div className="mt-8 md:mt-0 md:w-1/3 flex justify-center">
                  <div className="w-64 h-64 rounded-[2rem] bg-gradient-to-tr from-pink-500 to-rose-500 p-1">
                    <img src="https://images.unsplash.com/photo-1573497019940-1c28c88b4f3e?auto=format&fit=crop&q=80&w=600" className="w-full h-full object-cover rounded-[1.9rem]" alt="Profile" />
                  </div>
                </div>
              </section>

              <main className="max-w-6xl mx-auto px-6 py-12">
                <div className="flex flex-col md:flex-row justify-between items-center gap-4 mb-8">
                  <input type="text" placeholder="Search tech stack..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="w-full md:w-72 bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 text-sm focus:border-pink-500 outline-none" />
                  <div className="flex flex-wrap gap-2">
                    {categories.map((cat, i) => (
                      <button key={i} onClick={() => setFilterCategory(cat)} className={`px-3 py-1.5 rounded-xl text-xs font-bold border ${filterCategory === cat ? 'bg-pink-500 text-slate-950 border-pink-500' : 'bg-slate-900 border-slate-800 text-slate-400'}`}>{cat}</button>
                    ))}
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  {filteredProjects.map(p => (
                    <div key={p.id} className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden hover:border-pink-500/30 transition-all">
                      <div className="h-40 bg-slate-950"><img src={p.image} className="w-full h-full object-cover opacity-80" /></div>
                      <div className="p-5 space-y-3">
                        <span className="text-[10px] text-pink-500 font-bold tracking-widest uppercase">{p.category}</span>
                        <h3 className="font-bold text-slate-100">{p.title}</h3>
                        <p className="text-xs text-slate-400 line-clamp-2">{p.summary}</p>
                        <div className="flex flex-wrap gap-1 pt-2">
                          {p.tools.map((t, i) => <span key={i} className="text-[10px] bg-slate-950 px-2 py-0.5 rounded text-slate-300">{t}</span>)}
                        </div>
                        <div className="flex gap-4 text-xs font-bold pt-3 border-t border-slate-800">
                          <a href={p.githubLink} target="_blank" className="text-slate-300 hover:text-pink-400">Repository</a>
                          {p.dashboardLink && <a href={p.dashboardLink} target="_blank" className="text-pink-400 hover:underline">Live Demo</a>}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </main>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
